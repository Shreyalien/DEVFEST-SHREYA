<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Package Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f6f4ef;--ink:#1d2430;--mut:#5b6472;--ac:#1f5f5b;--bd:#d9d4c7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI","Noto Sans Bengali","Nirmala UI","Shonar Bangla",sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.15rem;margin:0 0 12px}
section{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:18px;margin-top:18px}
button,.btn{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s}
button:hover:not(:disabled),.btn:hover{background:#174946}
button:disabled{background:#b9bfc6;cursor:not-allowed}
button.ghost{background:#fff;color:var(--ac);border:1.5px solid var(--ac)}
button.sm{padding:4px 12px;font-size:.9rem}
:focus-visible{outline:3px solid #e0a100;outline-offset:2px}
select,input[type=date]{font:inherit;width:100%;padding:9px;border:1.5px solid #9aa3ad;border-radius:8px;background:#fff;color:var(--ink)}
input[type=file]{font:inherit}
input[type=file]::file-selector-button{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;margin-right:12px;cursor:pointer}
.row{display:grid;grid-template-columns:1.3fr 1.6fr 1fr 1fr;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--bd)}
.lbl{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
.b{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:700;font-size:.9rem;transition:background .2s}
.ok{background:#dcefe2;color:#14532d}.warn{background:#ece9e0;color:#45403a}.bad{background:#fde3df;color:#8a1c10}.need{background:#fcefc7;color:#6b4300}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin:14px 0 0}
.det dt{font-size:.8rem;color:var(--mut)}.det dd{margin:0;font-weight:600}
.file{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--bd)}
.file .n{flex:1;min-width:180px;word-break:break-all}
.msg{background:#fde3df;color:#8a1c10;padding:8px 12px;border-radius:8px;margin:8px 0}
.sum{font-weight:700;margin:0 0 6px}.mut{color:var(--mut)}
ul.why{margin:8px 0 14px;padding-left:22px}
@media(max-width:760px){.row{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<noscript>This app needs JavaScript.</noscript>
<script>
const I={
en:{app:'Tender Package Builder',intro:'Open the tender list, add your PDF files, choose the file for each document, then enter expiry dates. Everything stays in your browser.',
s1:'1. Load the tender requirements',openReq:'Open requirements.json',tid:'Tender ID',ttl:'Title',ent:'Procuring entity',bid:'Bidder',dl:'Submission deadline',
s2:'2. Upload PDF files',addPdf:'Add PDF files',noFiles:'No files uploaded yet.',pages:'pages',remove:'Remove',dup:'Duplicate',dupOf:'Same content as: {n}',used:'Used for: {n}',
s3:'3. Match files and check documents',doc:'Document',file:'File',exp:'Expiry date',st:'Status',none:'— No file —',mand:'Required',opt:'Optional',hasExp:'has expiry date',usedOpt:'(already used)',dupOpt:'(duplicate already used)',
missing:'Missing',needexp:'Expiry date needed',expired:'Expired',notprovided:'Not provided',ok:'OK',
s4:'4. Create the package',gen:'Generate package PDF',working:'Building PDF…',dlBtn:'Download {n}',blocked:'Cannot generate yet. Please fix:',ready:'Everything is OK. You can generate the package.',done:'Package ready: {p} pages.',
sum:'{ok} of {t} documents ready',needReq:'Load requirements.json first.',errReq:'This requirements file is not valid. Please check it.',
errNotPdf:'{n} is not a PDF file and was rejected.',errBad:'{n} is damaged or password-protected and was rejected.',errLimit:'Limit reached (30 files, 50 MB in total). {n} was not added.',errGen:'Could not create the package: {n}'},
bn:{app:'টেন্ডার প্যাকেজ বিল্ডার',intro:'টেন্ডারের তালিকা খুলুন, পিডিএফ ফাইল যোগ করুন, প্রতিটি নথির জন্য ফাইল বাছাই করুন, তারপর মেয়াদের তারিখ দিন। সবকিছু আপনার ব্রাউজারেই থাকে।',
s1:'১. টেন্ডারের প্রয়োজনীয় তালিকা খুলুন',openReq:'requirements.json খুলুন',tid:'টেন্ডার আইডি',ttl:'শিরোনাম',ent:'ক্রয়কারী প্রতিষ্ঠান',bid:'দরদাতা',dl:'জমাদানের শেষ তারিখ',
s2:'২. পিডিএফ ফাইল আপলোড করুন',addPdf:'পিডিএফ ফাইল যোগ করুন',noFiles:'এখনো কোনো ফাইল আপলোড করা হয়নি।',pages:'পৃষ্ঠা',remove:'মুছুন',dup:'ডুপ্লিকেট',dupOf:'একই বিষয়বস্তু: {n}',used:'ব্যবহার হয়েছে: {n}',
s3:'৩. ফাইল মিলান ও নথি যাচাই করুন',doc:'নথি',file:'ফাইল',exp:'মেয়াদ শেষের তারিখ',st:'অবস্থা',none:'— কোনো ফাইল নয় —',mand:'আবশ্যক',opt:'ঐচ্ছিক',hasExp:'মেয়াদের তারিখ আছে',usedOpt:'(ব্যবহৃত)',dupOpt:'(ডুপ্লিকেট আগেই ব্যবহৃত)',
missing:'অনুপস্থিত',needexp:'মেয়াদের তারিখ প্রয়োজন',expired:'মেয়াদ উত্তীর্ণ',notprovided:'দেওয়া হয়নি',ok:'ঠিক আছে',
s4:'৪. প্যাকেজ তৈরি করুন',gen:'প্যাকেজ পিডিএফ তৈরি করুন',working:'পিডিএফ তৈরি হচ্ছে…',dlBtn:'{n} ডাউনলোড করুন',blocked:'এখনো তৈরি করা যাচ্ছে না। আগে এগুলো ঠিক করুন:',ready:'সবকিছু ঠিক আছে। এখন প্যাকেজ তৈরি করতে পারেন।',done:'প্যাকেজ তৈরি: মোট {p} পৃষ্ঠা।',
sum:'{t}টির মধ্যে {ok}টি নথি প্রস্তুত',needReq:'আগে requirements.json খুলুন।',errReq:'এই requirements ফাইলটি সঠিক নয়। অনুগ্রহ করে যাচাই করুন।',
errNotPdf:'{n} পিডিএফ ফাইল নয়, তাই বাদ দেওয়া হয়েছে।',errBad:'{n} নষ্ট বা পাসওয়ার্ড-সুরক্ষিত, তাই বাদ দেওয়া হয়েছে।',errLimit:'সীমা পূর্ণ (সর্বোচ্চ ৩০টি ফাইল, মোট ৫০ MB)। {n} যোগ করা হয়নি।',errGen:'প্যাকেজ তৈরি করা যায়নি: {n}'}
};
const BLOCK=['missing','needexp','expired'],MB=1048576,FOOT=30;
let S={lang:'en',req:null,files:[],match:{},exp:{},msgs:[],pkg:null,busy:false},uid=0;
const t=(k,a)=>(I[S.lang][k]||I.en[k]).replace(/\{(\w+)\}/g,(_,x)=>a&&a[x]!=null?a[x]:'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fileOf=rid=>S.files.find(f=>f.id===S.match[rid]);
const title=r=>S.lang==='bn'&&r.title_bn?r.title_bn:r.title_en;
const pkgName=()=>S.req.tender.tender_id+'_Package.pdf';
function status(r){
  if(!fileOf(r.id))return r.mandatory?'missing':'notprovided';
  if(r.has_expiry){const e=S.exp[r.id];if(!e)return 'needexp';if(e<S.req.tender.submission_deadline)return 'expired';}
  return 'ok';
}
const cls={ok:'ok',notprovided:'warn',missing:'bad',expired:'bad',needexp:'need'};
function dupsOf(f){return S.files.filter(g=>g.hash===f.hash&&g.id!==f.id)}
function valid(j){
  return j&&j.tender&&['tender_id','title','procuring_entity','bidder','submission_deadline'].every(k=>typeof j.tender[k]==='string'&&j.tender[k])
   &&/^\d{4}-\d{2}-\d{2}$/.test(j.tender.submission_deadline)&&Array.isArray(j.requirements)&&j.requirements.length>0
   &&j.requirements.every(r=>r&&typeof r.id==='string'&&Number.isFinite(r.order)&&typeof r.title_en==='string'&&typeof r.mandatory==='boolean'&&typeof r.has_expiry==='boolean');
}
function change(){if(S.pkg){URL.revokeObjectURL(S.pkg.url);S.pkg=null}render()}
function render(){
  const act=document.activeElement&&document.activeElement.id;
  document.documentElement.lang=S.lang;
  const R=S.req,reqs=R?[...R.requirements].sort((a,b)=>a.order-b.order):[];
  let h=`<header><h1>${t('app')}</h1><button class="ghost" id="lang" data-lang>${S.lang==='en'?'বাংলা':'English'}</button></header><p class="mut">${t('intro')}</p>`;
  h+=`<div aria-live="polite">${S.msgs.map(m=>`<div class="msg" role="alert">${esc(t(m[0],m[1]))}</div>`).join('')}</div>`;
  h+=`<section><h2>${t('s1')}</h2><input type="file" id="fr" accept=".json,application/json" aria-label="${t('openReq')}">`;
  if(R){const T=R.tender;h+=`<dl class="det">${[['tid',T.tender_id],['ttl',T.title],['ent',T.procuring_entity],['bid',T.bidder],['dl',T.submission_deadline]].map(([k,v])=>`<div><dt>${t(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`}
  h+=`</section><section><h2>${t('s2')}</h2><input type="file" id="ff" accept=".pdf,application/pdf" multiple aria-label="${t('addPdf')}">`;
  if(!S.files.length)h+=`<p class="mut">${t('noFiles')}</p>`;
  for(const f of S.files){
    const d=dupsOf(f),rq=reqs.find(r=>S.match[r.id]===f.id);
    h+=`<div class="file"><span class="n"><b>${esc(f.name)}</b> <span class="mut">· ${f.pages} ${t('pages')}</span></span>`
     +(d.length?`<span class="b need" title="${esc(t('dupOf',{n:d.map(x=>x.name).join(', ')}))}">${t('dup')}: ${esc(d.map(x=>x.name).join(', '))}</span>`:'')
     +(rq?`<span class="b ok">${esc(t('used',{n:title(rq)}))}</span>`:'')
     +`<button class="ghost sm" data-rm="${f.id}">${t('remove')}</button></div>`;
  }
  h+=`</section><section><h2>${t('s3')}</h2>`;
  if(!R)h+=`<p class="mut">${t('needReq')}</p>`;
  else{
    const sts=reqs.map(status),okN=sts.filter(x=>x==='ok'||x==='notprovided').length;
    h+=`<p class="sum">${t('sum',{ok:okN,t:reqs.length})}</p>`;
    reqs.forEach((r,i)=>{
      const cur=S.match[r.id],st=sts[i];
      const opts=S.files.map(f=>{
        const other=Object.entries(S.match).some(([k,v])=>v===f.id&&k!==r.id);
        const dupUsed=S.files.some(g=>g.hash===f.hash&&g.id!==f.id&&Object.entries(S.match).some(([k,v])=>v===g.id&&k!==r.id));
        const dis=f.id!==cur&&(other||dupUsed);
        return `<option value="${f.id}"${f.id===cur?' selected':''}${dis?' disabled':''}>${esc(f.name)}${dis?' '+t(other?'usedOpt':'dupOpt'):''}</option>`;
      }).join('');
      h+=`<div class="row"><div><b>${esc(title(r))}</b><br><span class="mut">${t(r.mandatory?'mand':'opt')}${r.has_expiry?' · '+t('hasExp'):''}</span></div>`
       +`<div><label class="lbl" for="m${esc(r.id)}">${t('file')}</label><select id="m${esc(r.id)}" data-m="${esc(r.id)}"><option value="">${t('none')}</option>${opts}</select></div>`
       +`<div>${r.has_expiry&&cur?`<label class="lbl" for="e${esc(r.id)}">${t('exp')}</label><input type="date" id="e${esc(r.id)}" data-e="${esc(r.id)}" value="${esc(S.exp[r.id]||'')}">`:''}</div>`
       +`<div><span class="lbl">${t('st')}</span><span class="b ${cls[st]}">${t(st)}</span></div></div>`;
    });
  }
  h+=`</section><section><h2>${t('s4')}</h2>`;
  const bl=R?reqs.filter(r=>BLOCK.includes(status(r))):[];
  if(!R)h+=`<p class="mut">${t('needReq')}</p>`;
  else if(bl.length)h+=`<p>${t('blocked')}</p><ul class="why">${bl.map(r=>`<li>${esc(title(r))}: <b>${t(status(r))}</b></li>`).join('')}</ul>`;
  else h+=`<p>${t('ready')}</p>`;
  h+=`<button id="gen" data-gen${!R||bl.length||S.busy?' disabled':''}>${S.busy?t('working'):t('gen')}</button>`;
  if(S.pkg)h+=` <a class="btn" id="dl" href="${S.pkg.url}" download="${esc(pkgName())}">${esc(t('dlBtn',{n:pkgName()}))}</a><p class="sum">${t('done',{p:S.pkg.pages})}</p>`;
  h+=`</section>`;
  $app.innerHTML=h;
  if(act){const el=document.getElementById(act);if(el)el.focus()}
}
const $app=document.getElementById('app');
$app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-lang')){S.lang=S.lang==='en'?'bn':'en';render()}
  else if(b.dataset.rm){const id=+b.dataset.rm;S.files=S.files.filter(f=>f.id!==id);
    for(const k of Object.keys(S.match))if(S.match[k]===id){delete S.match[k];delete S.exp[k]}
    S.msgs=[];change()}
  else if(b.hasAttribute('data-gen'))build();
});
$app.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='fr'){
    S.msgs=[];const f=el.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());if(!valid(j))throw 0;S.req=j;S.match={};S.exp={}}catch(x){S.msgs=[['errReq']]}
    change();
  }else if(el.id==='ff'){await addFiles([...el.files])}
  else if(el.dataset.m){S.msgs=[];const r=el.dataset.m;
    if(el.value)S.match[r]=+el.value;else{delete S.match[r];delete S.exp[r]}
    change()}
  else if(el.dataset.e){S.msgs=[];if(el.value)S.exp[el.dataset.e]=el.value;else delete S.exp[el.dataset.e];change()}
});
async function addFiles(list){
  S.msgs=[];
  for(const f of list){
    if(S.files.length>=30||S.files.reduce((a,x)=>a+x.size,0)+f.size>50*MB){S.msgs.push(['errLimit',{n:f.name}]);continue}
    const buf=new Uint8Array(await f.arrayBuffer());
    if(String.fromCharCode(...buf.slice(0,5))!=='%PDF-'){S.msgs.push(['errNotPdf',{n:f.name}]);continue}
    let pages;
    try{pages=(await PDFLib.PDFDocument.load(buf)).getPageCount()}catch(x){S.msgs.push(['errBad',{n:f.name}]);continue}
    const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(x=>x.toString(16).padStart(2,'0')).join('');
    S.files.push({id:++uid,name:f.name,size:f.size,pages,hash,bytes:buf});
  }
  change();
}
const wa=s=>String(s).replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');
const cut=(s,n)=>{s=wa(s);return s.length>n?s.slice(0,n-3)+'...':s};
async function build(){
  S.msgs=[];S.busy=true;render();
  try{
    const {PDFDocument,StandardFonts,rgb}=PDFLib,T=S.req.tender;
    const items=[...S.req.requirements].sort((a,b)=>a.order-b.order).filter(r=>fileOf(r.id));
    const Y=1+items.reduce((a,r)=>a+fileOf(r.id).pages,0);
    const out=await PDFDocument.create();
    const H=await out.embedFont(StandardFonts.Helvetica),HB=await out.embedFont(StandardFonts.HelveticaBold);
    const footer=(pg,w,n)=>{const s=`${wa(T.tender_id)} | Page ${n} of ${Y}`;pg.drawText(s,{x:(w-H.widthOfTextAtSize(s,10))/2,y:12,size:10,font:H,color:rgb(0,0,0)})};
    const cp=out.addPage([595,842]);let y=780;
    cp.drawText('Tender Document Package',{x:50,y,size:22,font:HB,color:rgb(.12,.37,.36)});y-=42;
    for(const [l,v] of [['Tender ID',T.tender_id],['Title',T.title],['Procuring entity',T.procuring_entity],['Bidder',T.bidder],['Submission deadline',T.submission_deadline],['Package date',new Date().toISOString().slice(0,10)]]){
      cp.drawText(l+':',{x:50,y,size:11,font:HB});cp.drawText(cut(v,62),{x:190,y,size:11,font:H});y-=22;
    }
    y-=14;cp.drawText('Included documents',{x:50,y,size:14,font:HB});y-=26;
    const lh=Math.min(20,(y-60)/Math.max(items.length,1));let pn=2;
    items.forEach((r,i)=>{const n=fileOf(r.id).pages;
      cp.drawText(cut(`${i+1}. ${r.title_en}`,60),{x:50,y,size:Math.min(11,lh-3),font:H});
      cp.drawText(`page ${pn}${n>1?'-'+(pn+n-1):''}`,{x:440,y,size:Math.min(11,lh-3),font:H});pn+=n;y-=lh});
    footer(cp,595,1);
    let num=2;
    for(const r of items){
      const f=fileOf(r.id),src=await PDFDocument.load(f.bytes),emb=await out.embedPdf(src,src.getPageIndices());
      for(const e of emb){const pg=out.addPage([e.width,e.height+FOOT]);pg.drawPage(e,{x:0,y:FOOT});footer(pg,e.width,num++)}
    }
    const url=URL.createObjectURL(new Blob([await out.save()],{type:'application/pdf'}));
    S.pkg={url,pages:Y};
  }catch(x){S.msgs=[['errGen',{n:x.message||x}]]}
  S.busy=false;render();
}
render();
</script>
</body>
</html>
